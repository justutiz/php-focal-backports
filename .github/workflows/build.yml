name: Build focal packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with the "+backportN" suffix of every matrix new_version.
  RELEASE_TAG: focal-backport1

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: php8.3
            jammy_version: 8.3.36-1
            new_version: 8.3.36-1+ubuntu20.04.1+backport1
          - source: php8.1
            jammy_version: 8.1.34-9
            new_version: 8.1.34-9+ubuntu20.04.1+backport1
          - source: php8.0
            jammy_version: 8.0.30-25
            new_version: 1:8.0.30-25+ubuntu20.04.1+backport1
          - source: php7.4
            jammy_version: 7.4.33-31
            new_version: 1:7.4.33-31+ubuntu20.04.1+backport1
          - source: php7.3
            jammy_version: 7.3.33-35
            new_version: 7.3.33-35+ubuntu20.04.1+backport1
          - source: php5.6
            jammy_version: 5.6.40-104
            new_version: 5.6.40-104+ubuntu20.04.1+backport1
    steps:
      - uses: actions/checkout@v7

      - name: Check security changelog formats
        run: bash tests/check-changelog.sh

      - name: Build packages
        run: bash build.sh "${{ matrix.source }}" "${{ matrix.jammy_version }}" "${{ matrix.new_version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.source }}-build
          path: out/*.deb
          if-no-files-found: error

  test:
    needs: build
    # Test every version that built, even if another one failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: php8.3
          - source: php8.1
          - source: php8.0
          - source: php7.4
            # Ubuntu 20.04 ships its own php7.4, so test replacing it.
            upgrade: upgrade
          - source: php7.3
          - source: php5.6
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.source }}-build
          path: debs

      - name: Install and check the packages
        run: bash test.sh "${{ matrix.source }}" debs "${RELEASE_TAG#focal-}" ${{ matrix.upgrade }}

      # Only tested packages become release artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.source }}-focal-amd64
          path: debs/*.deb
          if-no-files-found: error

  release:
    needs: test
    # Publish whatever versions built successfully, even if another one failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-focal-amd64'
          path: artifacts

      - name: Package and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          for dir in artifacts/*-focal-amd64; do
            name="$(basename "$dir")"
            (cd "$dir" && sha256sum *.deb > SHA256SUMS)
            tar -czf "dist/${name}.tar.gz" -C "$dir" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          # Keep the checksums of versions that failed in this run, whose previous archives stay in the release.
          if gh release download "$RELEASE_TAG" --pattern SHA256SUMS --output previous.sums 2> /dev/null; then
            grep -vFf <(cd dist && ls *.tar.gz) previous.sums >> dist/SHA256SUMS || true
          fi

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "PHP rebuilds for Ubuntu 20.04 ($RELEASE_TAG)" \
              --notes "Patched PHP packages for Ubuntu 20.04 (amd64), including the fixes for CVE-2026-109618 and CVE-2026-109619. See the README for the included packages and the installation steps."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
